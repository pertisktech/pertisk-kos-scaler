[package]
name = "pertisk-kos-scaler"
version = "0.1.0"
edition = "2024"
description = "Kubernetes worker-node autoscaler for Pertisk KOS clusters"
authors = ["Pertisk Tech"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
humantime-serde = "1.1"
k8s-openapi = { version = "0.21", features = ["v1_29"] }
kube = { version = "0.90", features = ["client"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
