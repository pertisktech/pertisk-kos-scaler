{{- if not .Values.mgmt.existingSecret }}
{{- $hasUser := and .Values.mgmt.username .Values.mgmt.password }}
{{- $hasToken := .Values.mgmt.token }}
{{- if and (not $hasUser) (not $hasToken) }}
{{- fail "set mgmt.username+mgmt.password (recommended for long-running) or mgmt.token, or set mgmt.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kos-scaler.secretName" . }}
  labels:
    {{- include "kos-scaler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasUser }}
  username: {{ .Values.mgmt.username | quote }}
  password: {{ .Values.mgmt.password | quote }}
  {{- end }}
  {{- if $hasToken }}
  token: {{ .Values.mgmt.token | quote }}
  {{- end }}
{{- end }}
