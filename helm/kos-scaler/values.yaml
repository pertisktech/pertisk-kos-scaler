# Default values for kos-scaler
replicaCount: 1

image:
  repository: harbor.tools.pertisk.com/pertisksoft/kos-scaler
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kos-scaler.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
affinity: {}

# Pertisk management API
mgmt:
  endpoint: "https://mgmt.example.com:8080"
  clusterId: ""
  # Prefer an existing secret that already holds a JWT.
  existingSecret: ""
  # Used only when existingSecret is empty.
  token: ""
  secretKey: "token"

config:
  syncInterval: "30s"
  disableDuringJobs: true
  drainTimeout: "30m"
  listenAddr: "0.0.0.0:8080"
  maxEvents: 100
  ignoredNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  cooldowns:
    scaleUp: "2m"
    scaleDown: "10m"
  workerPool:
    minSize: 2
    maxSize: 10
    scaleUpPendingPods: 1
    targetUtilization: 0.5
    scaleUpThreshold: 0.65
    scaleDownThreshold: 0.35
    safeToEvictBuffer: 0.1
    # Optional VM overrides:
    # memory: 4096
    # cores: 4
    # diskGb: 40

logLevel: info

stateDir: "/var/lib/kos-scaler"

statePersistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
